services:
  - type: web
    name: pi-nachimban-study-group
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pi-nachimban-db
          property: connectionString
      - key: NODE_ENV
        value: production
databases:
  - name: pi-nachimban-db
    databaseName: pi_nachimban
    user: pi_nachimban
